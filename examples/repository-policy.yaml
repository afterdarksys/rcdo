version: "1"

critical_paths:
  - pattern: "infra/**"
    owner: "platform-team"
    severity: "high"
    reason: "Infrastructure changes can affect production availability."
  - pattern: ".github/workflows/**"
    owner: "security-team"
    severity: "warning"
    reason: "Workflow changes can alter code-execution and credential boundaries."

required_companions:
  - when: "infra/**"
    require:
      - "runbooks/**"
    reason: "Infrastructure changes require reviewed rollback and validation instructions."

forbidden_patterns:
  - files: "infra/**"
    pattern: "0\\.0\\.0\\.0/0"
    severity: "critical"
    title: "Repository policy forbids global IPv4 access"
    remediation: "Use an approved restricted CIDR and obtain security review."
