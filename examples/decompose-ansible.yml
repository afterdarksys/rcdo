- name: Decomposition demonstration
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create demonstration VPC
      amazon.aws.ec2_vpc_net:
        name: rcdo-demo
        cidr_block: 10.43.0.0/16
        state: present

    - name: Create demonstration instance
      amazon.aws.ec2_instance:
        image_id: ami-example-for-demo
        instance_type: t3.micro
        state: present
